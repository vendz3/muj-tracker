<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F172A" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Life Journal</title>
    <!-- Paint the saved theme before any module loads (themes.js caches its CSS variables here). -->
    <script>
      try {
        const v = JSON.parse(localStorage.getItem("lj-theme-vars") || "{}");
        for (const k in v) k === "color-scheme" ? (document.documentElement.style.colorScheme = v[k]) : document.documentElement.style.setProperty(k, v[k]);
      } catch {}
    </script>
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
